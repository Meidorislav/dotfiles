# Keep the NVIDIA GPU in its performance state instead of PowerMizer's
# adaptive mode. Under light but constant work (desktop animations at
# 144 Hz) the driver otherwise stays at the lowest clocks (P8, ~400 MHz)
# and drops frames. Costs some idle power.
options nvidia NVreg_RegistryDwords="PowerMizerEnable=0x1;PerfLevelSrc=0x2222;PowerMizerLevel=0x1;PowerMizerDefault=0x1;PowerMizerDefaultAC=0x1"
